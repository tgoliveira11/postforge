name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  branch-name:
    name: branch-name
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Require feature/fix/docs/chore prefix
        run: |
          BRANCH="${{ github.head_ref }}"
          if [[ ! "$BRANCH" =~ ^(feature|fix|docs|chore)/ ]]; then
            echo "::error::Branch '$BRANCH' must start with feature/, fix/, docs/, or chore/"
            exit 1
          fi
          echo "Branch name OK: $BRANCH"

  validate:
    name: validate
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postforge
          POSTGRES_PASSWORD: postforge
          POSTGRES_DB: postforge
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://postforge:postforge@localhost:5432/postforge
      NEXTAUTH_URL: http://localhost:3000
      APP_BASE_URL: http://localhost:3000
      NEXTAUTH_SECRET: ci-test-secret-at-least-32-characters-long
      TWO_FACTOR_SECRET_ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply database migrations
        run: npm run db:migrate

      - name: Validate
        run: npm run validate
